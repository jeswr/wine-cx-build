name: Try Steam on the runner

# Debugging aid, approved by the repository owner: installs Steam (no sign-in)
# into a throwaway bottle on the runner, starts it with a published build and
# keeps screenshots and logs. Each row of the matrix is one set-up to compare.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/try-steam.yml'
      - 'scripts/steamtest.sh'
      - 'scripts/cefwrap.c'

permissions:
  contents: read

jobs:
  steam:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Steam's browser program with Chromium's headless option, against the
          # same program with no extra option (through the same wrapper), in turns.
          # Steam checks its programs' sizes on each start and downloads its own
          # browser program again when the size differs (so the wrapper was never
          # used): -noverifyfiles, Steam's own option, skips that check
          - name: headless-macos-15
            runner: macos-15
            graphics: split
            own: "0"
          - name: headless-macos-latest
            runner: macos-latest
            graphics: split
            own: "0"
    env:
      TAG: wine-cx-26.3.0-patched-7
      GRAPHICS: ${{ matrix.graphics }}
      SKY_STEAM_OWN_D3D: ${{ matrix.own }}
      TRACE: fixme-all
      FIRST_TRACE: fixme-all
      MINUTES: "2"
      # one start of Steam per line, timed up to the sign-in screen
      ROUNDS: |-
        +cef: -noverifyfiles
        +cef:--headless -noverifyfiles
        +cef: -noverifyfiles
        +cef:--headless -noverifyfiles
        +cef:--headless=new -noverifyfiles
        +cef: -noverifyfiles
    steps:
      - uses: actions/checkout@v4

      - name: Install the build with the launcher
        run: |
          sw_vers; uname -m
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then echo "Intel programs run here"; else echo "No Rosetta on this runner"; fi
          export SKYWALKER_HOME="$RUNNER_TEMP/sky" SKYWALKER_APP="$RUNNER_TEMP/Applications/Skywalker Saga.app"
          export SKY_PREFIX="$RUNNER_TEMP/sky-prefix"
          /bin/bash scripts/skywalker.sh install "$TAG"

      - name: Build the wrapper for Steam's browser program
        run: |
          brew install mingw-w64 > /dev/null
          x86_64-w64-mingw32-gcc -O1 -Wall -municode -o "$RUNNER_TEMP/cefwrap.exe" scripts/cefwrap.c
          ls -la "$RUNNER_TEMP/cefwrap.exe"

      - name: Install Steam, start it and watch the screen
        run: |
          export CEFWRAP="$RUNNER_TEMP/cefwrap.exe"
          export SKYWALKER_HOME="$RUNNER_TEMP/sky" SKYWALKER_APP="$RUNNER_TEMP/Applications/Skywalker Saga.app"
          export SKY_PREFIX="$RUNNER_TEMP/sky-prefix"
          export STEAMTEST_OUT="$PWD/steam-logs"
          /bin/bash scripts/steamtest.sh "$MINUTES"

      - name: Upload the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-logs-${{ matrix.name }}
          path: steam-logs
          if-no-files-found: ignore
          retention-days: 5
